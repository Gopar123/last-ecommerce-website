<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Store</title>
  <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="bg-gray-950 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-tight cursor-pointer" onclick="switchTab('store')">G-Store</h1>
      
      <div class="flex items-center space-x-4">
        <!-- Auth View Status -->
        <div id="nav-user-info" class="text-sm font-medium"></div>

        <button id="admin-nav-btn" onclick="switchTab('admin')" class="hidden bg-black hover:bg-blue-950 text-xs px-3 py-1.5 rounded transition">
          Admin Panel
        </button>

        <button onclick="switchTab('cart')" class="relative bg-black hover:bg-blue-950 px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">Cart
          <span id="cart-count-badge" class="bg-red-500 text-white text-xs font-bold rounded-full px-2 py-0.5 ml-1">0</span>
        </button>

        <button id="auth-btn" onclick="toggleAuthModal()" class="bg-white text-black font-semibold px-3 py-1.5 rounded text-sm hover:bg-gray-100 transition">
          Login
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 py-8 grow w-full">
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-900 text-white px-4 py-2 rounded shadow-lg hidden transition-opacity duration-300 z-50"></div>

    <!-- TAB 1: Storefront View -->
    <section id="tab-store" class="space-y-6">
      <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">Catalog</h2>
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Injected via JavaScript -->
      </div>
    </section>

    <!-- TAB 2: Cart & Checkout View -->
    <section id="tab-cart" class="hidden space-y-6 max-w-3xl mx-auto">
      <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">Your Shopping Cart</h2>
      
      <div id="cart-items-container" class="space-y-4">
        <!-- Injected via JavaScript -->
      </div>

      <div class="bg-white p-6 rounded-lg shadow-sm border space-y-4">
        <div class="flex justify-between text-lg font-bold">
          <span>Total:</span>
          <span id="cart-total-price">₦0.00</span>
        </div>

        <div id="checkout-auth-warning" class="bg-black border-l-4 border-white text-sm text-white p-3 rounded hidden">
          You must be <button onclick="toggleAuthModal()" class="underline font-bold">logged in</button> to proceed to checkout.
        </div>

        <button id="checkout-btn" onclick="processCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed transition">
          Proceed to Checkout
        </button>
      </div>
    </section>

    <!-- TAB 3: Admin Dashboard View -->
    <section id="tab-admin" class="hidden space-y-8">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-2xl font-bold text-gray-800">Admin Dashboard</h2>
        <span class="text-xs bg-black text-white font-semibold px-2.5 py-0.5 rounded">Restricted Area</span>
      </div>

      <!-- Add Product Form -->
      <div class="bg-white p-6 rounded-lg shadow-sm border max-w-xl">
        <h3 class="text-lg font-semibold mb-4 text-gray-700">Add New Product</h3>
        <form id="add-product-form" onsubmit="handleAddProduct(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Product Name</label>
            <input type="text" id="admin-p-name" required class="mt-1 w-full p-2 border rounded-md focus:ring-black focus:border-white">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">Price (₦)</label>
            <input type="number" step="0.01" id="admin-p-price" required class="mt-1 w-full p-2 border rounded-md focus:ring-black focus:border-white">
          </div>
          <button type="submit" class="w-full bg-black hover:bg-blue-950 text-white font-semibold py-2 rounded-md transition">
            Add Product to Inventory
          </button>
        </form>
      </div>

      <!-- Inventory Table -->
      <div class="bg-white rounded-lg shadow-sm border overflow-hidden">
        <h3 class="text-lg font-semibold p-4 bg-gray-50 border-b text-gray-700">Current Inventory</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-100 text-gray-600 uppercase text-xs">
                <th class="py-3 px-4">ID</th>
                <th class="py-3 px-4">Product Name</th>
                <th class="py-3 px-4">Price</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="admin-inventory-table" class="divide-y divide-gray-200 text-sm">
              <!-- Injected via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- Login/Register Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white text-gray-900 rounded-lg shadow-xl p-6 w-full max-w-sm relative">
      <button onclick="toggleAuthModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">&times;</button>
      <h3 class="text-xl font-bold mb-4" id="modal-title">Log In</h3>
      
      <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600">Role Selection</label>
          <select id="auth-role" class="w-full p-2 border rounded mt-1 bg-gray-50 text-gray-900">
            <option value="user">Regular User</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600">Email</label>
          <input type="email" id="auth-email" required placeholder="user@example.com" class="w-full p-2 border rounded mt-1 bg-white text-gray-900">
        </div>
        <button type="submit" class="w-full bg-black hover:bg-blue-950 text-white font-bold py-2 rounded transition">
          Authenticate
        </button>
      </form>
    </div>
  </div>

  <!-- Vite module entry point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
